name: mckinsey_exec_hybrid
style: McKinsey × Executive 120s Hybrid
tone: authoritative_urgent
visual_identity:
  typography: clean_sans_cjk_fallback (Arial + PingFang SC / Microsoft YaHei)
  structure: pyramid
  titles: action_title_conclusion_first
  emphasis: huge_metric_numbers_on_key_pages
  contrast: restrained_pain_vs_gain (red/green only on designated pages)
