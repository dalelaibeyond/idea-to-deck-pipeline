best_for:
  - 120s executive strategy pitch
  - board-level business case, CJK output
first_validated: deck_20260919_658 (ICS workflow AI Agent strategy)
palette:
  primary: "#003366"
  accent: "#E8A33D"
  pain: "#C0392B"    # use on at most ONE complication page
